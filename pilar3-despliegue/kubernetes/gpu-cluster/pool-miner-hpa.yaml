apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: pool-miner
  namespace: g-git-push-cv
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: pool-miner
  minReplicas: 1
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70