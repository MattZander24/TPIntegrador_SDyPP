      labels:
        app: worker-pool-coordinator
    spec:
      terminationGracePeriodSeconds: 10
      containers:
        - name: worker
          image: southamerica-east1-docker.pkg.dev/voxchain/voxchain-images/worker-gpu:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: health
            - containerPort: 9001
              name: pool
            - containerPort: 9090
              name: admin
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          env:
            - name: WORKER_ID
              value: "worker-pool-coordinator"
            - name: WORKER_MODE
              value: "pool-coordinator"
            - name: POOL_HTTP_PORT
              value: "9001"
            - name: RABBITMQ_USER
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: username
            - name: RABBITMQ_PASS
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: password
            - name: RABBITMQ_HOST
              valueFrom:
                configMapKeyRef:
                  name: worker-config
                  key: rabbitmq-host
            - name: RABBITMQ_URL
              value: "amqp://$(RABBITMQ_USER):$(RABBITMQ_PASS)@$(RABBITMQ_HOST):5672/"
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: worker-config
                  key: redis-host
            - name: REDIS_URL
              value: "redis://$(REDIS_HOST):6379/0"
            - name: WORKER_CAPACITY
              value: "1"
            - name: LOG_DIR
              value: /var/log/voxchain
            - name: MINER_CPU_SCRIPT
              value: /app/pilar1-minero/cpu/src/brute_force.py
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
---
# Service para que los pool-miners encuentren al coordinator dentro del namespace
apiVersion: v1
kind: Service
metadata:
  name: worker-pool-coordinator
  namespace: g-git-push-cv
spec:
  selector:
    app: worker-pool-coordinator
  ports:
    - name: pool
      port: 9001
      targetPort: 9001
    - name: admin
      port: 9090
      targetPort: 9090
---
