apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: g-git-push-cv
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      terminationGracePeriodSeconds: 10
      containers:
        - name: worker
          image: southamerica-east1-docker.pkg.dev/voxchain/voxchain-images/worker:a7ac6d2
          imagePullPolicy: Always
          env:
            - name: RABBITMQ_URL
              value: "amqp://guest:guest@rabbitmq.voxchain.svc.cluster.local:5672/"
            - name: REDIS_URL
              value: ""
            - name: WORKER_CAPACITY
              value: "1"
            - name: LOG_DIR
              value: /var/log/voxchain
            - name: MINER_CPU_SCRIPT
              value: /app/pilar1-minero/cpu/src/brute_force.py
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
