apiVersion: apps/v1
kind: Deployment
metadata:
  name: pool-coordinator
  namespace: g-git-push-cv
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pool-coordinator
  template:
    metadata:
      labels:
        app: pool-coordinator
    spec:
      terminationGracePeriodSeconds: 10
      containers:
        - name: pool-coordinator
          # Pool Coordinator ahora es el mismo worker en modo pool-coordinator
          image: southamerica-east1-docker.pkg.dev/voxchain/voxchain-images/worker:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: health
            - containerPort: 9001
              name: http
          env:
            - name: RABBITMQ_USER
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: username
            - name: RABBITMQ_PASS
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: password
            - name: RABBITMQ_HOST
              valueFrom:
                configMapKeyRef:
                  name: worker-config
                  key: rabbitmq-host
            - name: RABBITMQ_URL
              value: "amqps://$(RABBITMQ_USER):$(RABBITMQ_PASS)@$(RABBITMQ_HOST):5671/"
            - name: RABBITMQ_TLS_CA_PATH
              value: /etc/ssl/certs/ca.crt
            - name: REDIS_URL
              value: "redis://redis:6379/0"
            - name: WORKER_MODE
              value: "pool-coordinator"
            - name: POOL_HTTP_PORT
              value: "9001"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: ca-cert
              mountPath: /etc/ssl/certs/ca.crt
              subPath: ca.crt
              readOnly: true
      volumes:
        - name: ca-cert
          secret:
            secretName: rabbitmq-ca