apiVersion: apps/v1
kind: Deployment
metadata:
  name: pool-coordinator
  namespace: g-git-push-cv
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pool-coordinator
  template:
    metadata:
      labels:
        app: pool-coordinator
    spec:
      terminationGracePeriodSeconds: 10
      containers:
        - name: pool-coordinator
          # Pool Coordinator ahora es el mismo worker en modo pool-coordinator
          image: southamerica-east1-docker.pkg.dev/voxchain/voxchain-images/worker:41d2b81-v3
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: health
            - containerPort: 9001
              name: http
          env:
            - name: RABBITMQ_URL
              value: "amqp://guest:guest@rabbitmq.voxchain.svc.cluster.local:5672/"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-credentials
                  key: password
            # FQDN cross-namespace + AUTH (A-02): el pool-coordinator usa Redis
            # para el lease pool:leader. El host era "redis" (no resolvía fuera de
            # voxchain); ahora apunta al Service real con contraseña.
            - name: REDIS_URL
              value: "redis://:$(REDIS_PASSWORD)@redis.voxchain.svc.cluster.local:6379/0"
            - name: WORKER_MODE
              value: "pool-coordinator"
            - name: POOL_HTTP_PORT
              value: "9001"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10