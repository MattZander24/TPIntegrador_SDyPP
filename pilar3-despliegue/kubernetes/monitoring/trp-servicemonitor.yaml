apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: transaction-pool
  namespace: voxchain
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: trp
  namespaceSelector:
    matchNames:
      - voxchain
  endpoints:
    - port: health
      path: /metrics
      interval: 15s
