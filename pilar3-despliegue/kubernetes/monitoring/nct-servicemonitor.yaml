apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: nct
  namespace: voxchain
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      component: nct
  namespaceSelector:
    matchNames:
      - voxchain
  endpoints:
    - port: health
      path: /metrics
      interval: 15s
