apiVersion: apps/v1
kind: Deployment
metadata:
  name: voxchain-api
  namespace: voxchain
spec:
  replicas: 2
  selector:
    matchLabels:
      app: voxchain-api
  template:
    metadata:
      labels:
        app: voxchain-api
    spec:
      containers:
        - name: api
          image: southamerica-east1-docker.pkg.dev/voxchain/voxchain-images/voxchain-api:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
              name: http
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          env:
            - name: RABBITMQ_USER
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: username
            - name: RABBITMQ_PASS
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: password
            - name: RABBITMQ_URL
              value: "amqp://$(RABBITMQ_USER):$(RABBITMQ_PASS)@rabbitmq:5672/"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-credentials
                  key: password
            - name: REDIS_URL
              value: "redis://:$(REDIS_PASSWORD)@redis:6379/0"
            - name: NCT_HEALTH_URL
              value: "http://nct:8080/health"
            - name: LOG_DIR
              value: "/var/log/voxchain"
          envFrom:
            - configMapRef:
                name: voxchain-config
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
