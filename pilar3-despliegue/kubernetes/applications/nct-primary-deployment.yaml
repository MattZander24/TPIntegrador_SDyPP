apiVersion: apps/v1
kind: Deployment
metadata:
  name: nct-primary
  namespace: voxchain
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nct-primary
  template:
    metadata:
      labels:
        app: nct-primary
        component: nct
    spec:
      containers:
        - name: nct
          image: southamerica-east1-docker.pkg.dev/voxchain/voxchain-images/nct:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: health
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          env:
            - name: RABBITMQ_USER
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: username
            - name: RABBITMQ_PASS
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: password
            - name: RABBITMQ_URL
              value: "amqp://$(RABBITMQ_USER):$(RABBITMQ_PASS)@rabbitmq:5672/"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-credentials
                  key: password
            - name: REDIS_URL
              value: "redis://:$(REDIS_PASSWORD)@redis:6379/0"
            - name: NCT_MODE
              value: "primary"
            - name: NCT_ID
              value: "nct-primary"
            - name: LOG_DIR
              value: "/var/log/voxchain"
          envFrom:
            - configMapRef:
                name: voxchain-config
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
