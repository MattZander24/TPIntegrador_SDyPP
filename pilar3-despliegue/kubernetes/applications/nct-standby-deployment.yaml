apiVersion: apps/v1
kind: Deployment
metadata:
  name: nct-standby
  namespace: voxchain
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nct-standby
  template:
    metadata:
      labels:
        app: nct-standby
    spec:
      containers:
        - name: nct
          image: southamerica-east1-docker.pkg.dev/voxchain/voxchain-images/nct:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: health
          env:
            - name: RABBITMQ_USER
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: username
            - name: RABBITMQ_PASS
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: password
            - name: RABBITMQ_URL
              value: "amqp://$(RABBITMQ_USER):$(RABBITMQ_PASS)@rabbitmq:5672/"
            - name: REDIS_URL
              value: "redis://redis:6379/0"
            - name: NCT_MODE
              value: "standby"
            - name: NCT_ID
              value: "nct-standby-1"
            - name: LOG_DIR
              value: "/var/log/voxchain"
          envFrom:
            - configMapRef:
                name: voxchain-config
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 15
