apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: trp-hpa
  namespace: voxchain
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: transaction-pool
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
