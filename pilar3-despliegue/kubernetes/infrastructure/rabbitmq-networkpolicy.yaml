apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: rabbitmq-allow-clients
  namespace: voxchain
spec:
  podSelector:
    matchLabels:
      app: rabbitmq
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app
                operator: In
                values: ["nct-primary", "nct-standby", "voxchain-api"]
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: g-git-push-cv
      ports:
        - protocol: TCP
          port: 5672
    - from:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 5671
