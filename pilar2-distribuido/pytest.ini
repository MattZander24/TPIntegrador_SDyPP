[pytest]
# Raíz de imports: con pilar2-distribuido/ en sys.path, `import common...` y
# los paquetes de cada servicio (nct, worker, trp) resuelven sin instalación.
pythonpath = . nct-coordinator worker
# importlib evita choques de nombre entre las múltiples carpetas `tests/`.
addopts = --import-mode=importlib
testpaths =
    common/tests
    nct-coordinator/tests
    worker/tests
    tests
markers =
    integration: pruebas de integración extremo a extremo (fake bus + fakeredis)
    xfail: funcionalidad pendiente documentada
