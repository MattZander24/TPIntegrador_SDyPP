# VoxChain — Pilar 2. `docker compose up` levanta RabbitMQ, Redis, el NCT, el
# transaction-pool y 2 workers. El contexto de build es la raíz del repo (..)
# para que cada imagen pueda copiar el paquete `common` y, el worker, el minero
# CPU de Pilar 1. Sin secretos en el archivo: credenciales por variables de
# entorno (ver common/config.py). RabbitMQ usa el usuario guest por defecto, apto
# sólo para desarrollo local; en la nube (Pilar 3) se inyectan vía Vault/Secrets.
name: voxchain-pilar2

x-app-env: &app-env
  RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
  REDIS_URL: redis://redis:6379/0
  N_ZEROS: "4"
  HEALTH_PORT: "8080"

services:
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  coordinator:
    build:
      context: ..
      dockerfile: pilar2-distribuido/nct-coordinator/Dockerfile
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: *app-env
      WINDOW_SECONDS_PROMULGACION: "120"
      WINDOW_SECONDS_DEROGACION: "180"
      NCT_MODE: "primary"
      NCT_ID: "nct-primary"
    ports:
      - "8081:8080"   # health endpoint del NCT

  coordinator-standby:
    build:
      context: ..
      dockerfile: pilar2-distribuido/nct-coordinator/Dockerfile
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: *app-env
      NCT_MODE: "standby"
      NCT_ID: "nct-standby-1"
      ELECTION_N_ZEROS: "2"
    # Sin puerto de host: sólo red interna

  transaction-pool:
    build:
      context: ..
      dockerfile: pilar2-distribuido/transaction-pool/Dockerfile
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      <<: *app-env
      NONCE_SPACE: "50000000"
      FRAGMENT_SIZE: "1000000"
    ports:
      - "8082:8080"   # health endpoint del TrP

  worker:
    build:
      context: ..
      dockerfile: pilar2-distribuido/worker/Dockerfile
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      <<: *app-env
      WORKER_CAPACITY: "1"
    deploy:
      replicas: 2
    # Sin publicar puerto de host: hay 2 réplicas; el health es accesible en la
    # red interna (puerto 8080 del contenedor).

  voxchain-api:
    build:
      context: ..
      dockerfile: pilar2-distribuido/voxchain_api/Dockerfile
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: *app-env
      NCT_HEALTH_URL: http://coordinator:8080/health
      TRP_HEALTH_URL: http://transaction-pool:8080/health
      PORT: "8000"
    ports:
      - "8000:8000"

  voxchain-frontend:
    build:
      context: voxchain-frontend
      dockerfile: Dockerfile
    ports:
      - "4200:80"
    depends_on:
      - voxchain-api

volumes:
  redis-data:
