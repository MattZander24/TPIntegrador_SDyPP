# VoxChain — Pilar 2. `docker compose up` levanta RabbitMQ, Redis, el NCT y
# workers en modo standalone (por defecto). El contexto de build es la raíz del
# repo (..) para que cada imagen pueda copiar el paquete `common` y, el worker,
# el minero CPU de Pilar 1.
name: voxchain-pilar2

x-app-env: &app-env
  RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
  REDIS_URL: redis://redis:6379/0
  N_ZEROS: "4"
  HEALTH_PORT: "8080"
  # Firma de propuestas (A-01). "false" = migración (acepta no firmadas, rechaza
  # firmas inválidas); "true" = rechazo duro. Compartido por NCT y API vía el anchor.
  REQUIRE_SIGNATURES: "false"
  PROPOSAL_MAX_AGE_SECONDS: "300"

services:
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  coordinator:
    build:
      context: ..
      dockerfile: pilar2-distribuido/nct-coordinator/Dockerfile
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: *app-env
      WINDOW_SECONDS_PROMULGACION: "120"
      WINDOW_SECONDS_DEROGACION: "180"
      NCT_MODE: "primary"
      NCT_ID: "nct-primary"
      ELECTION_N_ZEROS: "2"
      HEARTBEAT_INTERVAL: "3"
      HEARTBEAT_TIMEOUT: "12"
      LEADER_LEASE_TTL: "15"
    ports:
      - "8081:8080"   # health endpoint del NCT

  coordinator-standby:
    build:
      context: ..
      dockerfile: pilar2-distribuido/nct-coordinator/Dockerfile
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: *app-env
      NCT_MODE: "standby"
      NCT_ID: "nct-standby-1"
      ELECTION_N_ZEROS: "2"
      HEARTBEAT_INTERVAL: "3"
      HEARTBEAT_TIMEOUT: "12"
      LEADER_LEASE_TTL: "15"

  worker-1:
    build:
      context: ..
      dockerfile: pilar2-distribuido/worker/Dockerfile
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      <<: *app-env
      WORKER_MODE: "standalone"
      WORKER_CAPACITY: "1"
      WORKER_ID: "worker-1"
    ports:
      - "9091:9090"

  worker-2:
    build:
      context: ..
      dockerfile: pilar2-distribuido/worker/Dockerfile
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      <<: *app-env
      WORKER_MODE: "standalone"
      WORKER_CAPACITY: "1"
      WORKER_ID: "worker-2"
    ports:
      - "9092:9090"

  worker-pool-coordinator:
    build:
      context: ..
      dockerfile: pilar2-distribuido/worker/Dockerfile
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: *app-env
      WORKER_MODE: "pool-coordinator"
      WORKER_ID: "pool-coordinator-1"
      POOL_HTTP_PORT: "9001"
    ports:
      - "9090:9090"   # Admin server para hot-switch
      - "9001:9001"   # HTTP para pool-workers

  voxchain-api:
    build:
      context: ..
      dockerfile: pilar2-distribuido/voxchain_api/Dockerfile
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: *app-env
      NCT_HEALTH_URL: http://coordinator:8080/health
      PORT: "8000"
    ports:
      - "8000:8000"

  voxchain-frontend:
    build:
      context: voxchain-frontend
      dockerfile: Dockerfile
    ports:
      - "4200:80"
    depends_on:
      - voxchain-api

volumes:
  redis-data:
