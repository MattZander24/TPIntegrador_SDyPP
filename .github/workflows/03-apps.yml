name: "P3 - 03: Build & Deploy Apps"
on:
  push:
    branches: [main]
    paths:
      - "pilar2-distribuido/common/**"
      - "pilar2-distribuido/nct-coordinator/**"
      - "pilar2-distribuido/transaction-pool/**"
      - "pilar2-distribuido/voxchain_api/**"
      - "pilar2-distribuido/voxchain-frontend/**"
      - "pilar2-distribuido/worker/**"
  workflow_dispatch:

env:
  REGION: southamerica-east1
  PROJECT_ID: voxchain
  REGISTRY: southamerica-east1-docker.pkg.dev/voxchain/voxchain-images

jobs:
  build-and-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    strategy:
      matrix:
        service:
          - name: nct
            dockerfile: pilar2-distribuido/nct-coordinator/Dockerfile
            context: .
            deploy: true
            kind: deployment
            k8s_name: nct-primary
          - name: transaction-pool
            dockerfile: pilar2-distribuido/transaction-pool/Dockerfile
            context: .
            deploy: true
            kind: deployment
            k8s_name: transaction-pool
          - name: worker
            dockerfile: pilar2-distribuido/worker/Dockerfile
            context: .
            deploy: false
            kind: none
          - name: voxchain-api
            dockerfile: pilar2-distribuido/voxchain_api/Dockerfile
            context: .
            deploy: true
            kind: deployment
            k8s_name: voxchain-api
          - name: voxchain-frontend
            dockerfile: pilar2-distribuido/voxchain-frontend/Dockerfile
            context: pilar2-distribuido/voxchain-frontend
            deploy: true
            kind: deployment
            k8s_name: voxchain-frontend

    steps:
      - uses: actions/checkout@v4

      - id: auth
        name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Authenticate Docker
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev

      - name: Build & Push
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ matrix.service.name }}:${{ github.sha }}"
          docker build -f ${{ matrix.service.dockerfile }} \
            -t "$IMAGE" \
            -t "${{ env.REGISTRY }}/${{ matrix.service.name }}:latest" \
            ${{ matrix.service.context }}
          docker push "$IMAGE"
          docker push "${{ env.REGISTRY }}/${{ matrix.service.name }}:latest"

      - name: Get GKE credentials
        if: matrix.service.deploy
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: voxchain
          location: ${{ env.REGION }}

      - name: Deploy to GKE
        if: matrix.service.deploy
        run: |
          kubectl set image \
            -n voxchain \
            ${{ matrix.service.kind }}/${{ matrix.service.k8s_name }} \
            ${{ matrix.service.name }}=${{ env.REGISTRY }}/${{ matrix.service.name }}:${{ github.sha }}

      - name: Verify rollout
        if: matrix.service.deploy
        run: |
          kubectl rollout status \
            -n voxchain \
            ${{ matrix.service.kind }}/${{ matrix.service.k8s_name }} \
            --timeout=120s
