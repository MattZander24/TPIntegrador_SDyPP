name: "P3 - 04: Deploy GPU Workers"
on:
  push:
    branches: [main]
    paths:
      - "pilar3-despliegue/kubernetes/gpu-cluster/**"
  workflow_dispatch:

env:
  K8S_DIR: pilar3-despliegue/kubernetes/gpu-cluster
  NAMESPACE: g-git-push-cv
  REGION: southamerica-east1
  ZONE: southamerica-east1-a
  PROJECT_ID: voxchain

jobs:
  deploy:
    name: Deploy Workers to k3s
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Configure kubectl for k3s
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.K3S_KUBECONFIG }}" | base64 -d > ~/.kube/config

      - id: auth
        name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: voxchain
          location: ${{ env.ZONE }}

      - name: Get RabbitMQ LoadBalancer IP
        id: rabbitmq
        run: |
          IP=$(kubectl get svc -n voxchain rabbitmq \
            -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null || echo "")
          echo "RABBITMQ_HOST=${IP:-placeholder.voxchain.local}" >> $GITHUB_OUTPUT

      - name: Get Redis ClusterIP (for k3s worker status reporting)
        id: redis
        run: |
          IP=$(kubectl get svc -n voxchain redis \
            -o jsonpath='{.spec.clusterIP}' 2>/dev/null || echo "")
          if [[ -z "$IP" ]]; then
            IP=$(kubectl get svc -n voxchain redis \
              -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null || echo "")
          fi
          echo "REDIS_HOST=${IP:-}" >> $GITHUB_OUTPUT

      - name: Create namespace
        run: |
          kubectl apply -f ${{ env.K8S_DIR }}/namespace.yaml

      - name: Configure RabbitMQ and Redis hosts
        run: |
          kubectl create configmap worker-config \
            --namespace ${{ env.NAMESPACE }} \
            --from-literal=rabbitmq-host="${{ steps.rabbitmq.outputs.RABBITMQ_HOST }}" \
            --from-literal=redis-host="${{ steps.redis.outputs.REDIS_HOST }}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy secrets
        env:
          RABBITMQ_USER: ${{ secrets.RABBITMQ_USER }}
          RABBITMQ_PASS: ${{ secrets.RABBITMQ_PASS }}
          RABBITMQ_CA: ${{ secrets.RABBITMQ_CA_CERT }}
          RABBITMQ_HOST: ${{ steps.rabbitmq.outputs.RABBITMQ_HOST }}
        run: |
          kubectl create secret generic rabbitmq-ca \
            --namespace ${{ env.NAMESPACE }} \
            --from-literal=ca.crt="${RABBITMQ_CA}" \
            --dry-run=client -o yaml | kubectl apply -f -

          KEDA_HOST="amqps://${RABBITMQ_USER}:${RABBITMQ_PASS}@${RABBITMQ_HOST}:5671/"
          kubectl create secret generic rabbitmq-credentials \
            --namespace ${{ env.NAMESPACE }} \
            --from-literal=username="${RABBITMQ_USER}" \
            --from-literal=password="${RABBITMQ_PASS}" \
            --from-literal=keda-host="${KEDA_HOST}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy RBAC and configmaps
        run: |
          kubectl apply -f ${{ env.K8S_DIR }}/worker-rbac.yaml
          kubectl apply -f ${{ env.K8S_DIR }}/backend-proxy-rbac.yaml
          kubectl apply -f ${{ env.K8S_DIR }}/worker-modes-configmap.yaml

      - name: Deploy demo worker nodes (5 nodes for demo scenario)
        run: |
          kubectl apply -f ${{ env.K8S_DIR }}/demo-deployments.yaml

      - name: Verify deployments
        run: |
          for deploy in worker-standalone worker-pool-coordinator worker-pool-miner-1 worker-pool-miner-2 worker-pool-miner-3; do
            kubectl rollout status \
              -n ${{ env.NAMESPACE }} \
              deployment/$deploy \
              --timeout=120s
          done
