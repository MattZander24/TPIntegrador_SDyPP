name: CI Checks
on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  pytest:
    name: Pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pilar2-distribuido
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r nct-coordinator/requirements.txt
      - run: pip install -r transaction-pool/requirements.txt
      - run: pip install -r worker/requirements.txt
      - run: pip install pytest fakeredis
      - run: pytest -v --tb=short -x -k "not integration"
