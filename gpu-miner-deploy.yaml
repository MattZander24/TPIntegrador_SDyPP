apiVersion: apps/v1
kind: Deployment
metadata:
  name: gpu-miner
  namespace: g-git-push-cv
spec:
  replicas: 1
  selector:
    matchLabels: {app: gpu-miner}
  template:
    metadata:
      labels: {app: gpu-miner}
    spec:
      containers:
      - name: gpu-miner
        image: southamerica-east1-docker.pkg.dev/voxchain/voxchain-images/worker-gpu:latest
        env:
        - name: WORKER_MODE
          value: standalone
        - name: WORKER_ID
          value: gpu-miner-1060
        - name: RABBITMQ_USER
          valueFrom:
            secretKeyRef:
              name: rabbitmq-credentials
              key: username
        - name: RABBITMQ_PASS
          valueFrom:
            secretKeyRef:
              name: rabbitmq-credentials
              key: password
        - name: RABBITMQ_HOST
          valueFrom:
            configMapKeyRef:
              name: worker-config
              key: rabbitmq-host
        - name: RABBITMQ_URL
          value: "amqp://$(RABBITMQ_USER):$(RABBITMQ_PASS)@$(RABBITMQ_HOST):5672/"
        - name: WORKER_CAPACITY
          value: "1"
        resources:
          limits:
            nvidia.com/gpu: 1